<!doctype html><html lang="en-ZA"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff Attendance</title><style>
:root{font:16px/1.5 system-ui;background:#f2f5f3;color:#182a25}main{max-width:900px;margin:40px auto;padding:0 18px}section,form{background:white;padding:20px;border-radius:12px;margin:16px 0}section form{padding:0}label{display:block;margin:8px 0}input,button{font:inherit;padding:8px;border:1px solid #769188;border-radius:6px}button{background:#16473a;color:white;cursor:pointer}table{border-collapse:collapse;width:100%}td,th{text-align:left;padding:8px;border-bottom:1px solid #dce5df}.scroll{overflow:auto}[hidden]{display:none}
</style><main><h1>Staff Attendance</h1><form id="login"><label>Email <input type="email" name="email" autocomplete="username" required></label><label>Password <input type="password" name="password" autocomplete="current-password" required></label><button>Sign in</button></form><p id="status" role="status"></p><div id="admin" hidden><button id="refresh">Refresh</button> <button id="logout">Sign out</button><section><h2>Add staff member</h2><form id="staff"><label>Name <input name="first_name" maxlength="100" required></label><label>Surname <input name="surname" maxlength="100" required></label><label>Email <input name="email" type="email" maxlength="254" required></label><label>RFID UID <input name="card_uid" maxlength="20" pattern="[A-Fa-f0-9]{8}|[A-Fa-f0-9]{14}|[A-Fa-f0-9]{20}" required></label><p>Copy the UID from the scanner's Serial Monitor. After saving, scan the dedicated blank card again to enroll it.</p><button>Add staff member</button></form></section><section><h2>Staff</h2><div class="scroll"><table><thead><tr><th>Name</th><th>Email</th><th>Card UID</th></tr></thead><tbody id="people"></tbody></table></div></section><section><h2>Clock history</h2><p id="history-caption">Latest scans in South African time</p><div class="scroll"><table><thead><tr><th>Name</th><th>Direction</th><th>Date and time</th></tr></thead><tbody id="history"></tbody></table></div><button id="newer">Newer</button> <button id="older">Older</button></section></div></main>
<script type="module">
const base='https://phcsslnsofaojnnxwrrj.supabase.co';
const key="sb_publishable_P4klXq8ECCIgpeJCUQN2nw_bLcY9ZFh";
const el = id => document.getElementById(id);
const login=el('login'), staff=el('staff'), status=el('status');
let token='', busy=false, page=0;
const formatter=new Intl.DateTimeFormat('en-ZA',{timeZone:'Africa/Johannesburg',dateStyle:'medium',timeStyle:'medium'});
async function api(path, method='GET', body) {
 const response=await fetch(base+path,{method,cache:'no-store',headers:{apikey:key,'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},...(body?{body:JSON.stringify(body)}:{})});
 if(!response.ok) throw new Error(response.status===409?'That email or card is already assigned.':response.status===401?'Sign-in failed or expired.':'Request failed ('+response.status+').');
 return response.status===204||method==='POST'&&path.startsWith('/rest')?null:response.json();
}
function rows(id,items,empty){
 const table=el(id); table.replaceChildren();
 for(const values of items.length?items:[[empty]]){
  const tr=table.insertRow(); for(const value of values) tr.insertCell().textContent=value;
 }
}
async function refresh(){
 const [people,events]=await Promise.all([api('/rest/v1/attendance_staff?select=first_name,surname,email,card_uid&order=surname,first_name'),api('/rest/v1/attendance_events?select=direction,scanned_at,attendance_staff(first_name,surname)&order=id.desc&limit=51&offset='+page*50)]);
 rows('people',people.map(p=>[p.first_name+' '+p.surname,p.email,p.card_uid]),'No staff added.');
 rows('history',events.slice(0,50).map(e=>[e.attendance_staff?e.attendance_staff.first_name+' '+e.attendance_staff.surname:'Staff member',e.direction==='in'?'Clock in':'Clock out',formatter.format(new Date(e.scanned_at))]),'No scans recorded.');
 el('newer').disabled=page===0; el('older').disabled=events.length<51;
}
async function run(work){
 if(busy)return;busy=true;status.textContent='';
 try{await work();}catch(e){status.textContent=e.message;}finally{busy=false;}
}
login.onsubmit=e=>{e.preventDefault();void run(async()=>{
 try{
  const session=await api('/auth/v1/token?grant_type=password','POST',Object.fromEntries(new FormData(login)));
  if(session.user?.app_metadata?.freeap_admin!==true)throw new Error('Admin access is required.');
  token=session.access_token;await refresh();login.reset();login.hidden=true;el('admin').hidden=false;
 }catch(error){token='';throw error;}finally{login.elements.password.value='';}
});};
staff.onsubmit=e=>{e.preventDefault();void run(async()=>{
 const person=Object.fromEntries(new FormData(staff));for(const field in person)person[field]=person[field].trim();
 person.card_uid=person.card_uid.toUpperCase();await api('/rest/v1/attendance_staff','POST',person);staff.reset();
 await refresh();status.textContent='Staff member saved. Scan their card again to enroll it.';
});};
el('refresh').onclick=()=>run(async()=>{page=0;await refresh();});
el('older').onclick=()=>run(async()=>{page++;try{await refresh();}catch(error){page--;throw error;}});
el('newer').onclick=()=>run(async()=>{if(page===0)return;page--;try{await refresh();}catch(error){page++;throw error;}});
el('logout').onclick=()=>run(async()=>{try{await api('/auth/v1/logout?scope=local','POST');}finally{token='';page=0;el('admin').hidden=true;login.hidden=false;el('people').replaceChildren();el('history').replaceChildren();}});
</script>
