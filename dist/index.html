<!doctype html><html lang="en-ZA"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alarm Clock</title>
<style>
:root{color-scheme:dark;font:16px/1.55 system-ui,sans-serif;background:#111719;color:#eaf1ed}body{margin:0}main{max-width:560px;margin:auto;padding:clamp(24px,7vw,72px) 22px}h1{font-size:clamp(3rem,10vw,5rem);line-height:1;letter-spacing:-.065em;margin:0 0 20px}p{color:#b7c8c1}form{display:grid;gap:12px}label{display:grid;gap:4px}input,button{font:inherit;padding:10px 12px;border-radius:7px;border:1px solid #557067}input{background:#1c2727;color:inherit}button{color:#112722;background:#b8f4d7;cursor:pointer}button:disabled{opacity:.55}button.secondary{background:transparent;color:#b8f4d7}ol{padding:0;list-style:none}li{display:flex;align-items:center;justify-content:space-between;border-top:1px solid #40524d;padding:12px 0}time{font-size:2rem;font-variant-numeric:tabular-nums}section{margin-top:26px}button:focus-visible,input:focus-visible{outline:2px solid #b8f4d7;outline-offset:3px}[hidden]{display:none!important}
</style></head><body><main>
<h1>Alarm Clock</h1><p>Daily alarms · South African time (SAST)</p>
<form id="login">
<label>Email <input type="email" name="email" autocomplete="username" required></label>
<label>Password <input type="password" name="password" autocomplete="current-password" required></label>
<button>Sign in</button>
</form>
<p id="status" role="status"></p>
<section id="clock" hidden>
<form id="new"><label>Alarm time <input name="time" type="time" required></label><button>Add alarm</button></form>
<h2>Daily alarms</h2><ol id="list"></ol>
<button id="logout" class="secondary">Sign out</button>
<p>While online, the clock checks for changes about once a minute.</p>
</section></main>
<script type="module">
const url = 'https://phcsslnsofaojnnxwrrj.supabase.co';
const key = "sb_publishable_P4klXq8ECCIgpeJCUQN2nw_bLcY9ZFh";
const login = document.querySelector('#login');
const clock = document.querySelector('#clock');
const newAlarm = document.querySelector('#new');
const status = document.querySelector('#status');
const list = document.querySelector('#list');
let token = '';
let busy = false;

function timeLabel(minute) {
  return String(Math.floor(minute / 60)).padStart(2, '0') + ':' + String(minute % 60).padStart(2, '0');
}
function api(path, options = {}) {
  return fetch(url + path, {
    ...options,
    headers: { apikey: key, 'Content-Type': 'application/json',
      ...(token ? { Authorization: 'Bearer ' + token } : {}), ...options.headers },
    cache: 'no-store'
  });
}
async function loadAlarms() {
  const response = await api('/rest/v1/freeap_alarms?select=minute_of_day&order=minute_of_day');
  if (!response.ok) throw new Error('Could not load alarms. Sign in again if your session expired.');
  const alarms = await response.json();
  list.replaceChildren();
  if (!alarms.length) list.append(Object.assign(document.createElement('li'), { textContent: 'No alarms scheduled.' }));
  for (const { minute_of_day: minute } of alarms) {
    const row = document.createElement('li');
    const time = document.createElement('time');
    time.dateTime = time.textContent = timeLabel(minute);
    const remove = document.createElement('button');
    remove.className = 'secondary';
    remove.textContent = 'Remove';
    remove.setAttribute('aria-label', 'Remove ' + time.textContent + ' alarm');
    remove.addEventListener('click', () => changeAlarm('DELETE', minute));
    row.append(time, remove);
    list.append(row);
  }
}
async function changeAlarm(method, minute) {
  if (busy) return;
  busy = true;
  status.textContent = 'Saving…';
  try {
    const response = await api('/rest/v1/freeap_alarms' + (method === 'DELETE' ? '?minute_of_day=eq.' + minute : ''), {
      method, body: method === 'POST' ? JSON.stringify({ minute_of_day: minute }) : undefined
    });
    if (response.status === 409) throw new Error('An alarm already exists at that time.');
    if (!response.ok) throw new Error('Could not save the change.');
    if (method === 'POST') newAlarm.reset();
    await loadAlarms();
    status.textContent = 'Schedule saved.';
  } catch (error) {
    status.textContent = error.message;
  } finally {
    busy = false;
  }
}
login.addEventListener('submit', async (event) => {
  event.preventDefault();
  if (busy) return;
  busy = true;
  status.textContent = 'Signing in…';
  try {
    const response = await api('/auth/v1/token?grant_type=password', {
      method: 'POST', body: JSON.stringify(Object.fromEntries(new FormData(login)))
    });
    if (!response.ok) throw new Error('Sign-in failed.');
    const session = await response.json();
    if (session.user?.app_metadata?.freeap_admin !== true) throw new Error('Clock admin access is required.');
    token = session.access_token;
    await loadAlarms();
    login.reset();
    login.hidden = true;
    clock.hidden = false;
    status.textContent = '';
  } catch (error) {
    token = '';
    status.textContent = error.message;
  } finally {
    login.elements.password.value = '';
    busy = false;
  }
});
newAlarm.addEventListener('submit', (event) => {
  event.preventDefault();
  const [hours, minutes] = newAlarm.elements.time.value.split(':').map(Number);
  changeAlarm('POST', hours * 60 + minutes);
});
document.querySelector('#logout').addEventListener('click', () => {
  if (busy) return;
  void api('/auth/v1/logout?scope=local', {method:'POST'}).catch(() => {});
  token = '';
  list.replaceChildren();
  clock.hidden = true;
  login.hidden = false;
  status.textContent = 'Signed out.';
});
</script></body></html>
